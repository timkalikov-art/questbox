<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d120b"><title>QUESTBOX</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>RAUS AUS DEM SCROLLEN</small><h1>QUESTBOX</h1></div><div class="avatar">QB</div></header>
<main>
<section id="today" class="view active"><div class="hello"><div><small>HEUTIGE MISSION</small><h2 id="greeting">Bereit fürs Abenteuer?</h2></div><div class="streak">🔥 <b id="streak">0</b></div></div><div id="questCard"></div><div class="actions"><button id="done" class="primary">✓ Mission geschafft</button><button id="next">↻ Andere Mission</button></div><div class="progressline"><span id="levelText">Level 1</span><div><i id="xpbar"></i></div><span id="xpText">0 / 100 XP</span></div></section>
<section id="adventures" class="view"><h2>Abenteuer</h2><p class="lead">Keine einzelnen Aufgaben – echte kleine Kampagnen.</p><div id="campaigns"></div><h2 class="space">Alle Missionen</h2><div class="filters"><select id="age"><option value="0">Jedes Alter</option><option value="4">ab 4</option><option value="5">ab 5</option><option value="6">ab 6</option><option value="7">ab 7</option></select><select id="place"><option value="all">Überall</option><option value="inside">Drinnen</option><option value="outside">Draußen</option></select></div><div id="questList"></div></section>
<section id="profile" class="view"><h2>Deine QUESTBOX</h2><div class="levelcard"><small>AKTUELLES LEVEL</small><b id="bigLevel">1</b><span id="rank">Neuling</span></div><div class="grid"><div><b id="totalXp">0</b><span>XP</span></div><div><b id="doneCount">0</b><span>Missionen</span></div><div><b id="bestStreak">0</b><span>Streak</span></div></div><h3>Abzeichen</h3><div id="badges"></div><h3>Letzte Missionen</h3><div id="history"></div><button id="reset" class="danger">Fortschritt zurücksetzen</button></section>
</main><nav><button data-view="today" class="active">⌂<span>Heute</span></button><button data-view="adventures">✦<span>Abenteuer</span></button><button data-view="profile">◎<span>Fortschritt</span></button></nav>
<div id="celebrate" class="modal"><div><b>MISSION GESCHAFFT!</b><span id="earned">+0 XP</span><button id="continue">Weiter</button></div></div><script src="app.js"></script></body></html>
