<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11150f"><title>QUESTBOX</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>KLEINE QUESTS. ECHTE MOMENTE.</small><h1>QUESTBOX</h1></div><button id="theme" aria-label="Design wechseln">◐</button></header>
<main>
<section id="home" class="view active"><div class="stats"><span><b id="level">1</b><small>LEVEL</small></span><span><b id="xp">0</b><small>XP</small></span><span><b id="streak">0</b><small>STREAK</small></span></div><article id="questCard" class="hero"></article><div class="actions"><button id="done" class="primary">Quest geschafft</button><button id="next">Nächste Quest</button></div><div class="quick"><button id="surprise">🎲 Überrasch mich</button><button id="five">⚡ Nur 5 Minuten</button></div></section>
<section id="library" class="view"><h2>Quests</h2><div class="filters"><select id="timeFilter"><option value="all">Alle Zeiten</option><option value="5">5 Min.</option><option value="10">10 Min.</option><option value="15">15 Min.</option></select><select id="placeFilter"><option value="all">Überall</option><option value="inside">Drinnen</option><option value="outside">Draußen</option></select></div><div id="questList"></div></section>
<section id="progress" class="view"><h2>Dein Fortschritt</h2><div class="panel"><div class="big" id="pXp">0 XP</div><p id="pLevel">Level 1</p><p id="pDone">0 Quests geschafft</p><p id="pStreak">0 Tage Streak</p></div><h3>Letzte Quests</h3><div id="history"></div><button id="reset" class="danger">Fortschritt zurücksetzen</button></section>
</main><nav><button data-view="home" class="active">⌂<span>Heute</span></button><button data-view="library">▦<span>Quests</span></button><button data-view="progress">◎<span>Fortschritt</span></button></nav><script src="app.js"></script></body></html>
